<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ChatGPT Bridge</title>
    <style>
      :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--tone:#59b9ff;--tone-soft:rgba(89,185,255,.24)}
      *{box-sizing:border-box}body{margin:0;width:380px;min-height:540px;color:#eaf7ff;background:#06101e;overflow:hidden}
      body[data-state="ok"]{--tone:#35e8aa;--tone-soft:rgba(53,232,170,.24)}
      body[data-state="expiring"]{--tone:#f4bc58;--tone-soft:rgba(244,188,88,.25)}
      body[data-state="error"],body[data-state="expired"],body[data-state="revoked"]{--tone:#ff637e;--tone-soft:rgba(255,99,126,.25)}
      body[data-state="paused"]{--tone:#8393a9;--tone-soft:rgba(131,147,169,.2)}
      .shell{position:relative;isolation:isolate;padding:20px 20px 18px;min-height:540px;background:radial-gradient(220px 180px at 86% 9%,rgba(28,102,150,.22),transparent 75%),linear-gradient(150deg,#0e1e33,#07111f 55%,#090f1a)}
      .shell:before,.shell:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(38px);opacity:.4}
      .shell:before{width:170px;height:170px;right:-55px;top:100px;background:var(--tone-soft);transition:background .5s}
      .shell:after{width:140px;height:140px;left:-70px;bottom:70px;background:rgba(70,91,209,.18)}
      .top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;border:1px solid rgba(155,206,239,.25);background:linear-gradient(135deg,#182e48,#0d1b2d);box-shadow:inset 0 1px rgba(255,255,255,.1),0 7px 20px rgba(0,0,0,.22)}
      .mark svg{width:23px;height:23px;stroke:#b9fef3;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .brand strong{display:block;font-size:14px;letter-spacing:.01em}.brand span{display:block;margin-top:2px;color:#8ca4b9;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
      .version{font-size:10px;letter-spacing:.15em;color:#7190a9;border:1px solid rgba(158,200,235,.13);padding:5px 7px;border-radius:99px}
      .hero{text-align:center;margin:19px 0 16px}.orb-button{display:grid;place-items:center;width:176px;height:176px;border:0;background:transparent;margin:0 auto;padding:0;cursor:pointer;position:relative;border-radius:50%;outline-offset:5px}
      .orb-button:focus-visible{outline:2px solid var(--tone)}.orb-button:before,.orb-button:after{content:"";position:absolute;inset:4px;border:1px solid var(--tone-soft);border-radius:50%;animation:ripple 3.2s ease-out infinite}.orb-button:after{animation-delay:1.6s}
      .orb{position:relative;display:grid;place-items:center;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(177,232,255,.18),transparent 42%),radial-gradient(circle at 50% 58%,#152d45,#091522 74%);border:2px solid var(--tone);box-shadow:0 0 0 9px var(--tone-soft),0 0 26px var(--tone-soft),0 0 58px var(--tone-soft),inset 0 0 22px rgba(0,0,0,.5);transition:transform .3s,box-shadow .4s,border-color .4s}
      .orb-button:hover .orb{transform:scale(1.045);box-shadow:0 0 0 9px var(--tone-soft),0 0 42px var(--tone-soft),0 0 75px var(--tone-soft),inset 0 0 22px rgba(0,0,0,.5)}
      .orb svg{width:83px;height:83px;fill:none;stroke:#ebfeff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--tone))}.orb path{stroke-dasharray:150;stroke-dashoffset:0;animation:beat 2.6s ease-in-out infinite}
      .orb-status{position:absolute;bottom:16px;right:24px;width:16px;height:16px;border-radius:50%;background:var(--tone);border:3px solid #0b1928;box-shadow:0 0 12px var(--tone)}
      .hero h1{font-size:21px;letter-spacing:-.04em;margin:3px 0 4px}.hero p{margin:0;color:#9ab1c5;font-size:12px;line-height:1.45;min-height:18px}
      .status-chip{display:inline-flex;align-items:center;gap:7px;color:var(--tone);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;border:1px solid var(--tone-soft);background:var(--tone-soft);border-radius:100px;padding:7px 10px;transition:all .35s}
      .chip-dot{width:6px;height:6px;border-radius:50%;background:var(--tone);box-shadow:0 0 9px var(--tone);animation:pulse 1.7s ease-in-out infinite}
      .panel{border:1px solid rgba(143,190,218,.13);background:linear-gradient(145deg,rgba(24,47,70,.67),rgba(10,25,43,.84));border-radius:18px;box-shadow:0 12px 26px rgba(0,0,0,.17),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(16px)}
      .connection{padding:14px;margin-top:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row+.row{margin-top:13px}.label{font-size:11px;color:#839cb1}.value{font-size:11px;font-weight:700;color:#d7f8f5;text-align:right;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tone);box-shadow:0 0 9px var(--tone);margin-right:6px}
      .divider{height:1px;margin:12px 0;background:linear-gradient(90deg,transparent,rgba(183,218,239,.15),transparent)}
      .controls{display:flex;gap:10px;margin-top:11px}.button{appearance:none;cursor:pointer;border:1px solid rgba(157,210,236,.2);background:rgba(255,255,255,.045);color:#e5f6ff;border-radius:12px;padding:11px 12px;font-family:inherit;font-size:12px;font-weight:700;transition:transform .2s,background .2s,box-shadow .2s}.button:hover{transform:translateY(-2px);background:rgba(255,255,255,.085)}.button:disabled{opacity:.55;cursor:wait;transform:none}
      .button.primary{flex:1;color:#061621;border-color:transparent;background:linear-gradient(115deg,#4fe9c0,#77c7ff);box-shadow:0 8px 22px rgba(65,200,207,.2)}.button.primary:hover{box-shadow:0 10px 30px rgba(65,200,207,.35)}.button.secondary{flex:1}
      .settings{margin-top:12px;padding:13px 14px}.settings-copy strong{display:block;font-size:12px}.settings-copy span{display:block;color:#839cb1;font-size:11px;margin-top:3px}.switch{position:relative;border:1px solid rgba(136,189,217,.3);width:46px;height:26px;border-radius:20px;background:#263a4d;cursor:pointer;transition:background .25s,box-shadow .25s}.switch:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#d8e5ed;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s}.switch[aria-checked="true"]{background:linear-gradient(100deg,#169876,#29b99b);box-shadow:0 0 16px rgba(53,232,170,.2)}.switch[aria-checked="true"]:before{transform:translateX(20px);background:#fff}
      .auto-done{display:flex;align-items:center;gap:8px;color:#80eec4;font-size:11px;margin-top:11px}.auto-done svg{width:15px;height:15px;stroke:#80eec4;fill:none;stroke-width:2.4}
      .connect-form{margin-top:14px}.connect-form label{display:block;color:#9db4c5;font-size:11px;font-weight:700;margin-bottom:7px}.connect-form input{display:block;width:100%;border:1px solid rgba(144,189,212,.23);border-radius:11px;background:rgba(3,15,27,.7);color:#eaffff;padding:11px 12px;font-family:inherit;font-size:12px;outline:none;transition:border-color .2s,box-shadow .2s}.connect-form input:focus{border-color:#61d8d5;box-shadow:0 0 0 3px rgba(55,207,196,.1)}.connect-form input::placeholder{color:#658095}
      .message{color:#9fb8ca;font-size:11px;line-height:1.45;margin:10px 1px 0;min-height:16px}.message.error{color:#ff91a2}.footer{display:flex;justify-content:space-between;color:#58728a;font-size:10px;margin-top:14px}.footer button{border:0;background:none;color:#7da8bd;font:inherit;cursor:pointer;padding:0}.footer button:hover{color:#bdebe8}
      [hidden]{display:none!important}@keyframes ripple{0%{transform:scale(.78);opacity:.65}75%,100%{transform:scale(1.15);opacity:0}}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.78)}}@keyframes beat{0%,100%{stroke-dashoffset:0;opacity:1}50%{stroke-dashoffset:7;opacity:.75}}
      @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
    </style>
  </head>
  <body data-state="connecting">
    <div class="shell">
      <header class="top">
        <div class="brand"><div class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16h6l3-7 5 15 4-8h8"/></svg></div><div><strong>ChatGPT Bridge</strong><span>Session connector</span></div></div>
        <span class="version">V 0.2</span>
      </header>
      <section class="hero" aria-live="polite">
        <button id="orb" class="orb-button" title="Activar o pausar renovación automática" aria-label="Activar o pausar renovación automática">
          <span class="orb"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M11 51h21l10-22 17 43 11-22h19"/></svg></span>
          <span class="orb-status"></span>
        </button>
        <div class="status-chip"><span class="chip-dot"></span><span id="state-label">Conectando</span></div>
        <h1 id="headline">Buscando tu bridge</h1>
        <p id="subline">Tu sesión segura, siempre a punto.</p>
      </section>
      <section class="panel connection" aria-label="Estado de la conexión">
        <div class="row"><span class="label">Cuenta</span><span class="value" id="account">Sin vincular</span></div>
        <div class="row"><span class="label">Bridge</span><span class="value"><span class="online-dot"></span><span id="server">Buscando</span></span></div>
        <div class="divider"></div>
        <div class="row"><span class="label">Token válido hasta</span><span class="value" id="expiry">—</span></div>
        <div class="row"><span class="label">Última renovación</span><span class="value" id="last-sync">—</span></div>
      </section>
      <section class="panel settings">
        <div class="row"><div class="settings-copy"><strong>Renovación automática</strong><span>Se activa 2 días antes del vencimiento</span></div><button id="auto-toggle" class="switch" type="button" role="switch" aria-label="Renovación automática" aria-checked="true"></button></div>
        <div id="auto-done" class="auto-done" hidden><svg viewBox="0 0 18 18"><path d="M3 9l4 4 8-9"/></svg>Renovada automáticamente</div>
      </section>
      <div id="connect-form" class="connect-form"><label for="ip">IP del ordenador con Bridge <span style="font-weight:400;color:#6f91a5">· opcional</span></label><input id="ip" inputmode="decimal" autocomplete="off" placeholder="Automático · este ordenador"></div>
      <div class="controls"><button id="connect" class="button primary">Conectar ahora</button><button id="refresh" class="button secondary" hidden>Renovar ahora</button></div>
      <p id="message" class="message" role="status"></p>
      <footer class="footer"><span>Sesión cifrada de extremo a bridge</span><button id="change-account" hidden>Cambiar cuenta</button></footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
